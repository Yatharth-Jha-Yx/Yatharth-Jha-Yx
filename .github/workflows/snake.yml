name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch:      # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Draw the GitHub-style contribution graph with the snake
        env:
          # SNAKE_TOKEN (optional, your own token) lets the graph count private contributions too
          GH_TOKEN: ${{ secrets.SNAKE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/contrib_snake.py "${{ github.repository_owner }}" dist
          python3 .github/scripts/profile_header.py dist

      - name: Publish the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
