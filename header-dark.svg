<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Yatharth Jha — high impact, low footprint">
<style>
.p{font:13px ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,monospace;fill:#9198a1;letter-spacing:.5px}
.n{font:300 60px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif;fill:#f0f6fc;letter-spacing:-1.5px}
.t{font:400 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif;fill:#9198a1;letter-spacing:3px;text-transform:uppercase}
.r{stroke:#f85149;stroke-width:2;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140;animation:draw 1.1s cubic-bezier(.65,0,.35,1) .2s forwards}
.c{fill:#f85149;animation:blink 1s steps(1) 2.4s infinite;opacity:0}
.m{animation:reveal 1.4s steps(26) 1.1s forwards}
.hair{stroke:#3d444d;stroke-width:1}
.f{opacity:0;animation:fade .6s ease-out forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.5s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes reveal{from{width:0}to{width:292px}}
@keyframes fade{to{opacity:1}}
</style>
<defs><clipPath id="k"><rect class="m" x="0" y="120" width="0" height="40"/></clipPath></defs>
<text class="p f d1" x="0" y="34">~/mumbai/yatharth</text>
<text class="n f d2" x="-3" y="98">Yatharth Jha</text>
<line class="r" x1="2" y1="118" x2="140" y2="118"/>
<g clip-path="url(#k)"><text class="t" x="0" y="150" textLength="292" lengthAdjust="spacing">high impact, low footprint</text></g>
<rect class="c" x="298" y="138" width="7" height="15"/>
<line class="hair" x1="0" y1="209" x2="900" y2="209"/>
</svg>
